<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS Insight Flask</title>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
</head>
<body class="light">
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon logx-icon-img"><img src="/static/logx-icon-scanlines.jpeg" alt="logX"></div>
      <div class="brand-text"><h1>logX</h1><p>sosreport analyzer</p></div><span class="brand-collapse-hint"><i class="bi bi-chevron-left"></i></span>
    </div>

    <nav>
      <button class="nav active" data-view="dashboard" data-tip="Dashboard"><span class="nav-icon"><i class="bi bi-speedometer2"></i></span><span class="nav-text">Dashboard</span></button>
      <button class="nav" data-view="troubleshooting" data-tip="Troubleshooting findings"><span class="nav-icon"><i class="bi bi-wrench-adjustable-circle"></i></span><span class="nav-text">Troubleshooting</span></button>
      <button class="nav" data-view="Summary" data-tip="Summary from xsos -a"><span class="nav-icon"><i class="bi bi-card-text"></i></span><span class="nav-text">Summary</span></button>
      <button class="nav" data-view="systeminfo" data-tip="System Information"><span class="nav-icon"><i class="bi bi-motherboard"></i></span><span class="nav-text">System Information</span></button>
      <button class="nav" data-view="Network" data-tip="Network"><span class="nav-icon"><i class="bi bi-ethernet"></i></span><span class="nav-text">Network</span></button>
      <button class="nav" data-view="Storage" data-tip="Storage"><span class="nav-icon"><i class="bi bi-device-hdd"></i></span><span class="nav-text">Storage</span></button>
      <button class="nav" data-view="messages" data-tip="Messages"><span class="nav-icon"><i class="bi bi-terminal"></i></span><span class="nav-text">Messages</span></button>
      <button class="nav" data-view="dmesg" data-tip="Dmesg logs"><span class="nav-icon"><i class="bi bi-card-list"></i></span><span class="nav-text">Dmesg</span></button>
      <button class="nav" data-view="console" data-tip="Console"><span class="nav-icon"><i class="bi bi-terminal-split"></i></span><span class="nav-text">Console</span></button>
      <button class="nav" data-view="recent" data-tip="Recent Files"><span class="nav-icon"><i class="bi bi-clock-history"></i></span><span class="nav-text">Recent Files</span></button>
      <div class="nav-dash-separator"></div>
      <button class="nav nav-upload" data-view="upload" data-tip="Upload sosreport"><span class="nav-icon"><i class="bi bi-cloud-arrow-up"></i></span><span class="nav-text">Upload sosreport</span></button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h2 id="pageTitle">Dashboard</h2><p id="caseLabel">No sosreport loaded</p></div>
      <button id="themeToggle"><i class="bi bi-moon-stars"></i> <span>Dark Mode</span></button>
    </header>
    <section id="content"></section>
  </main>
</div>

<div id="uploadModal" class="modal-backdrop" aria-hidden="true">
  <div class="modal-card upload-modal-card">
    <div class="modal-header">
      <div>
        <h3>Upload sosreport</h3>
        <p>Select a sosreport archive, optionally give it a case name, then upload and parse it.</p>
      </div>
      <button id="uploadClose" class="modal-close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
    </div>

    <label class="input-label" for="caseName">Case name / alias</label>
    <input id="caseName" class="case-name-input" placeholder="Example: CASEID, PROD-DB01, incident-12345">
    <small class="field-help">Allowed characters are letters, numbers, underscore, and dash. It will be inserted into the generated case ID.</small>

    <label id="dropZone" class="drop-zone" for="sosFile">
      <span class="drop-icon"><i class="bi bi-cloud-arrow-up"></i></span>
      <strong>Choose or drag-drop sosreport file</strong>
      <small>.tar, .tar.xz, .tgz, .tar.gz, .tar.bz2</small>
      <div id="selectedFile" class="selected-file">No file selected</div>
      <div class="progress-wrap upload-progress-inline">
        <div id="uploadProgressBar" class="progress-bar"></div>
      </div>
      <div id="uploadProgressText" class="progress-text">0%</div>
      <input type="file" id="sosFile" accept=".tar,.tar.xz,.txz,.tgz,.tar.gz,.tar.bz2,.tbz2" hidden>
    </label>

    <div class="modal-actions">
      <button id="uploadBtn"><i class="bi bi-upload"></i> Upload & Analyze</button>
      <button id="uploadCancel" class="ghost-btn">Cancel</button>
    </div>

    <div id="uploadStatus"></div>
  </div>
</div>

<div id="chartModal" class="chart-modal-backdrop" aria-hidden="true">
  <div class="chart-modal-card">
    <div class="chart-modal-title" id="chartModalTitle">SAR Chart</div>
    <div class="chart-modal-actions">
      <button id="downloadPng" class="chart-tool-btn"><i class="bi bi-download"></i> Download PNG</button>
      <button id="downloadJpg" class="chart-tool-btn"><i class="bi bi-image"></i> Download JPG</button>
      <button id="chartResetZoom" class="chart-tool-btn"><i class="bi bi-arrow-clockwise"></i> Reset Zoom</button>
      <button id="chartModalClose" class="chart-tool-btn close-chart"><i class="bi bi-x-lg"></i> Close</button>
    </div>
    <div class="chart-modal-canvas-wrap"><canvas id="chartModalCanvas"></canvas></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
